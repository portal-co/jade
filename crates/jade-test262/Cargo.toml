[package]
name = "portal-solutions-jade-test262"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true

[dependencies]
portal-solutions-jade-vm = { path = "../jade-vm", features = ["alloc"] }
portal-solutions-jade-vm-frontend = { path = "../jade-vm-frontend" }
portal-solutions-jade-vm-jit = { path = "../jade-vm-jit", features = ["reloop"] }
portal-solutions-jade-vm-jit-swc = { path = "../jade-vm-jit-swc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "jade-test262"
path = "src/main.rs"
