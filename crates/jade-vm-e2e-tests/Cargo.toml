[package]
name = "portal-solutions-jade-vm-e2e-tests"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
publish = false

[features]
tier2 = ["portal-solutions-jade-vm-wsdom/tier2"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portal-solutions-jade-vm-frontend = { path = "../jade-vm-frontend" }
portal-solutions-jade-vm-jit = { path = "../jade-vm-jit" }
portal-solutions-jade-vm-wsdom = { path = "../jade-vm-wsdom" }
px-wsdom = { package = "px-wsdom", version = "0.0.6", git = "https://github.com/portal-co/wsdom.git" }
px-wsdom-core = { package = "px-wsdom-core", version = "0.0.6", git = "https://github.com/portal-co/wsdom.git" }

[dev-dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-test = "0.3"
futures-util = "0.3"
